<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #ffffff; color: #111111; padding: 15px; margin: 0; }
        .vtx-app-root { display: flex; flex-direction: column; gap: 10px; }
        .vtx-box { padding: 15px; border-radius: 8px; background: #f1f5f9; border: 1px solid #cbd5e1; }
        .vtx-button { padding: 10px 18px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .vtx-text { margin: 5px 0; line-height: 1.5; }
    </style>
</head>
<body>
<div class="vtx-app-root">
  <div class="vtx-box">
    <p class="vtx-text">Welcome to Titlr!</p>
    <button class="vtx-button">Click Me</button>
  </div>
</div>
</body>
</html>
